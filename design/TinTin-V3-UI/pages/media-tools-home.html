/* ═══════════════════════════════════════════════════════════════
   TinTin V3 UI — colors_and_type.css
   Based on Luosiding Design System with Cherry Studio layout influence.
   Light mode by default; dark mode available via .dark class.
   ═══════════════════════════════════════════════════════════════ */

:root {
  /* === Indigo brand === */
  --luosiding-indigo-50: #e0e7ff;
  --luosiding-indigo-100: #c7d2fe;
  --luosiding-indigo-200: #a5b4fc;
  --luosiding-indigo-300: #818cf8;
  --luosiding-indigo-400: #6366f1;
  --luosiding-indigo-500: #4f46e5;
  --luosiding-indigo-600: #4338ca;
  --luosiding-indigo-700: #3730a3;
  --luosiding-indigo-800: #312e81;
  --luosiding-indigo-900: #1e1b4b;

  /* === Violet accent === */
  --luosiding-violet-50: #f5f3ff;
  --luosiding-violet-100: #ede9fe;
  --luosiding-violet-200: #ddd6fe;
  --luosiding-violet-300: #c4b5fd;
  --luosiding-violet-400: #a78bfa;
  --luosiding-violet-500: #8b5cf6;
  --luosiding-violet-600: #7c3aed;
  --luosiding-violet-700: #6d28d9;
  --luosiding-violet-800: #5b21b6;
  --luosiding-violet-900: #4c1d95;

  /* === Slate neutral === */
  --luosiding-slate-0: #ffffff;
  --luosiding-slate-50: #f0f1f7;
  --luosiding-slate-100: #c3c6d2;
  --luosiding-slate-200: #9ca1b1;
  --luosiding-slate-300: #73788c;
  --luosiding-slate-400: #5f6475;
  --luosiding-slate-500: #4c5060;
  --luosiding-slate-600: #3a3e4b;
  --luosiding-slate-700: #2b3040;
  --luosiding-slate-800: #1e212b;
  --luosiding-slate-900: #151722;
  --luosiding-slate-950: #0b0c10;

  /* === Status === */
  --luosiding-success-400: #34d399;
  --luosiding-success-500: #10b981;
  --luosiding-warning-400: #fbbf24;
  --luosiding-warning-500: #f59e0b;
  --luosiding-error-400: #f87171;
  --luosiding-error-500: #ef4444;
  --luosiding-info-400: #60a5fa;
  --luosiding-info-500: #3b82f6;

  /* === Semantic aliases (light default) === */
  --background: var(--luosiding-slate-0);
  --foreground: var(--luosiding-slate-900);
  --card: var(--luosiding-slate-0);
  --card-foreground: var(--luosiding-slate-900);
  --popover: var(--luosiding-slate-0);
  --popover-foreground: var(--luosiding-slate-900);
  --primary: var(--luosiding-indigo-500);
  --primary-foreground: var(--luosiding-slate-0);
  --secondary: var(--luosiding-slate-100);
  --secondary-foreground: var(--luosiding-slate-900);
  --muted: var(--luosiding-slate-100);
  --muted-foreground: var(--luosiding-slate-400);
  --accent: var(--luosiding-violet-500);
  --accent-foreground: var(--luosiding-slate-0);
  --destructive: var(--luosiding-error-500);
  --destructive-foreground: var(--luosiding-slate-0);
  --border: var(--luosiding-slate-200);
  --input: var(--luosiding-slate-200);
  --ring: var(--luosiding-indigo-400);

  /* === Shadcn-style color aliases === */
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-secondary: var(--secondary);
  --color-secondary-foreground: var(--secondary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-accent: var(--accent);
  --color-accent-foreground: var(--accent-foreground);
  --color-destructive: var(--destructive);
  --color-destructive-foreground: var(--destructive-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);

  /* === Surface hierarchy === */
  --surface: var(--luosiding-slate-0);
  --surface-dim: var(--luosiding-slate-50);
  --surface-bright: var(--luosiding-slate-0);
  --surface-container-lowest: var(--luosiding-slate-0);
  --surface-container-low: var(--luosiding-slate-50);
  --surface-container: var(--luosiding-slate-100);
  --surface-container-high: var(--luosiding-slate-200);
  --surface-container-highest: var(--luosiding-slate-300);

  /* === Status aliases === */
  --color-success: var(--luosiding-success-500);
  --color-warning: var(--luosiding-warning-500);
  --color-error: var(--luosiding-error-500);
  --color-info: var(--luosiding-info-500);

  /* === Radius === */
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 10px;
  --radius-xl: 12px;
  --radius-2xl: 14px;
  --radius-full: 9999px;

  /* === Prefixed semantic aliases for tooling === */
  --luosiding-background: var(--background);
  --luosiding-foreground: var(--foreground);
  --luosiding-card: var(--card);
  --luosiding-card-foreground: var(--card-foreground);
  --luosiding-popover: var(--popover);
  --luosiding-popover-foreground: var(--popover-foreground);
  --luosiding-primary: var(--primary);
  --luosiding-primary-foreground: var(--primary-foreground);
  --luosiding-secondary: var(--secondary);
  --luosiding-secondary-foreground: var(--secondary-foreground);
  --luosiding-muted: var(--muted);
  --luosiding-muted-foreground: var(--muted-foreground);
  --luosiding-accent: var(--accent);
  --luosiding-accent-foreground: var(--accent-foreground);
  --luosiding-destructive: var(--destructive);
  --luosiding-destructive-foreground: var(--destructive-foreground);
  --luosiding-border: var(--border);
  --luosiding-input: var(--input);
  --luosiding-ring: var(--ring);
  --luosiding-radius-sm: var(--radius-sm);
  --luosiding-radius-md: var(--radius-md);
  --luosiding-radius-lg: var(--radius-lg);
  --luosiding-radius-xl: var(--radius-xl);
  --luosiding-radius-full: var(--radius-full);

  /* === Typography === */
  --font-display: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --font-heading: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --font-body: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;

  --font-size-display: 48px;
  --font-size-h1: 32px;
  --font-size-h2: 26px;
  --font-size-h3: 21px;
  --font-size-h4: 18px;
  --font-size-body: 14px;
  --font-size-lead: 16px;
  --font-size-caption: 12px;
  --font-size-eyebrow: 11px;
  --font-size-mono: 13px;

  --font-weight-display: 700;
  --font-weight-h1: 700;
  --font-weight-h2: 600;
  --font-weight-h3: 600;
  --font-weight-h4: 600;
  --font-weight-body: 400;
  --font-weight-lead: 400;
  --font-weight-caption: 400;
  --font-weight-eyebrow: 600;
  --font-weight-mono: 400;

  --line-height-display: 1.1;
  --line-height-h1: 1.2;
  --line-height-h2: 1.25;
  --line-height-h3: 1.3;
  --line-height-h4: 1.4;
  --line-height-body: 1.6;
  --line-height-lead: 1.6;
  --line-height-caption: 1.5;
  --line-height-eyebrow: 1.4;
  --line-height-mono: 1.6;

  /* === Spacing === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-7: 28px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* === Sizing === */
  --size-button-height: 36px;
  --size-button-height-sm: 28px;
  --size-button-height-lg: 44px;
  --size-input-height: 34px;
  --size-icon-sm: 16px;
  --size-icon-md: 20px;
  --size-icon-lg: 24px;
  --size-sidebar-width: 264px;
  --size-page-header-height: 56px;
  --size-page-footer-height: 44px;

  /* === Shadows === */
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.25);
  --shadow-2: 0 4px 12px rgba(0, 0, 0, 0.35);
  --shadow-3: 0 8px 24px rgba(0, 0, 0, 0.45);
  --shadow-4: 0 16px 40px rgba(0, 0, 0, 0.55);
  --shadow-5: 0 24px 60px rgba(0, 0, 0, 0.65);

  /* === Motion === */
  --duration-fast: 150ms;
  --duration-normal: 200ms;
  --duration-slow: 300ms;
  --easing-default: cubic-bezier(0.4, 0, 0.2, 1);
  --easing-in: cubic-bezier(0.4, 0, 1, 1);
  --easing-out: cubic-bezier(0, 0, 0.2, 1);

  /* === Layout === */
  --max-content-width: 1440px;
  --gutter-content: var(--space-6);
  --nav-height: 56px;
}

  --foreground: var(--luosiding-slate-50);

  --surface-container-high: var(--luosiding-slate-700);

  --color-info: var(--luosiding-info-400);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.25);

  --shadow-3: 0 8px 24px rgba(0, 0, 0, 0.45);

  --shadow-5: 0 24px 60px rgba(0, 0, 0, 0.65);
}

/* === Typography classes === */
.luo-display { font-family: var(--font-display); font-size: 3rem; font-weight: var(--font-weight-display); line-height: var(--line-height-display); letter-spacing: -0.02em; }
.luo-h1 { font-family: var(--font-heading); font-size: 2rem; font-weight: var(--font-weight-h1); line-height: var(--line-height-h1); }
.luo-h2 { font-family: var(--font-heading); font-size: 1.625rem; font-weight: var(--font-weight-h2); line-height: var(--line-height-h2); }
.luo-h3 { font-family: var(--font-heading); font-size: 1.3125rem; font-weight: var(--font-weight-h3); line-height: var(--line-height-h3); }
.luo-h4 { font-family: var(--font-heading); font-size: 1.125rem; font-weight: var(--font-weight-h4); line-height: var(--line-height-h4); }
.luo-body { font-family: var(--font-body); font-size: 0.875rem; font-weight: var(--font-weight-body); line-height: var(--line-height-body); }
.luo-lead { font-family: var(--font-body); font-size: 1rem; font-weight: var(--font-weight-lead); line-height: var(--line-height-lead); }
.luo-caption { font-family: var(--font-body); font-size: 0.75rem; font-weight: var(--font-weight-caption); line-height: var(--line-height-caption); }
.luo-eyebrow { font-family: var(--font-body); font-size: 0.6875rem; font-weight: var(--font-weight-eyebrow); line-height: var(--line-height-eyebrow); letter-spacing: 0.08em; text-transform: uppercase; }
.luo-mono { font-family: var(--font-mono); font-size: 0.8125rem; font-weight: var(--font-weight-mono); line-height: var(--line-height-mono); }

/* === Utility classes === */
.luo-focus-ring { outline: none; box-shadow: 0 0 0 2px var(--ring); }

/* === Base reset for design pages === */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  font-size: var(--font-size-body);
  line-height: var(--line-height-body);
  color: var(--foreground);
  background: var(--background);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font-family: inherit; font-size: inherit; }
button { cursor: pointer; }
